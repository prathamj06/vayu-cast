name: Hourly AQI Batch Ingestion & Forecast Pipeline

on:
  schedule:
    # Run at the top of every hour (00:00, 01:00, 02:00, ...)
    - cron: '0 * * * *'
  workflow_dispatch:
    # Allow manual execution via GitHub UI

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Live Ingestion, XGBoost Forecasting & Gemini Advisories
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WAQI_API_TOKEN: ${{ secrets.WAQI_API_TOKEN }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          GEE_PROJECT_ID: ${{ secrets.GEE_PROJECT_ID }}
        run: |
          python -m backend.pipeline

      - name: Deploy Snapshot to Single-Commit Data Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the freshly generated JSON snapshot in a temporary directory
          mkdir -p /tmp/vayu_export
          cp frontend/public/data/delhi_current_grid.json /tmp/vayu_export/
          
          # Create/switch to an isolated orphan 'data' branch (zero historical bloat)
          git checkout --orphan data
          git rm -rf .
          
          # Place the single data snapshot file at the root of the data branch
          cp /tmp/vayu_export/delhi_current_grid.json ./
          
          git add delhi_current_grid.json
          git commit -m "chore(data): live hourly AQI grid snapshot [skip ci]"
          
          # Force push to overwrite previous data commit (guarantees exactly 1 commit forever)
          git push --force origin data
