name: Hourly AQI Batch Ingestion & Forecast Pipeline

on:
  schedule:
    # Run at off-peak minute 17 of every hour (00:17, 01:17, 02:17, ...) to eliminate runner queue congestion
    - cron: '17 * * * *'
  workflow_dispatch:
    # Allow manual execution via GitHub UI or external webhook

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Restore Calibration State from Data Branch
        run: |
          mkdir -p backend/data
          git fetch origin data --depth=1 || true
          git show origin/data:backend/data/calibration_state.json > /tmp/cal_state.json 2>/dev/null && cp /tmp/cal_state.json backend/data/calibration_state.json || echo "No previous calibration state found on data branch; using baseline."

      - name: Execute Live Ingestion, XGBoost Forecasting & Gemini Advisories
        env:
          DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WAQI_API_TOKEN: ${{ secrets.WAQI_API_TOKEN }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          GEE_PROJECT_ID: ${{ secrets.GEE_PROJECT_ID }}
        run: |
          python -m backend.pipeline

      - name: Deploy Snapshot & Calibration State to Single-Commit Data Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the freshly generated JSON snapshot and calibration ledger in a temporary directory
          mkdir -p /tmp/vayu_export/frontend/public/data
          mkdir -p /tmp/vayu_export/backend/data
          cp frontend/public/data/delhi_current_grid.json /tmp/vayu_export/
          cp frontend/public/data/delhi_current_grid.json /tmp/vayu_export/frontend/public/data/
          cp backend/data/calibration_state.json /tmp/vayu_export/backend/data/
          
          # Create a lightweight no-op frontend package so Vercel preview builds succeed cleanly
          cat << 'EOF' > /tmp/vayu_export/frontend/package.json
          {
            "name": "vayucast-data-feed",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo 'Data branch preview build skipped' && exit 0"
            }
          }
          EOF
          
          # Switch to isolated orphan 'data' branch (zero historical bloat on main)
          git checkout --orphan data
          git rm -rf .
          
          # Place the single data snapshot files, calibration state, and dummy frontend
          cp /tmp/vayu_export/delhi_current_grid.json ./
          mkdir -p frontend/public/data
          mkdir -p backend/data
          cp /tmp/vayu_export/frontend/public/data/delhi_current_grid.json ./frontend/public/data/
          cp /tmp/vayu_export/backend/data/calibration_state.json ./backend/data/
          cp /tmp/vayu_export/frontend/package.json ./frontend/package.json
          
          git add .
          git commit -m "chore(data): live hourly AQI grid snapshot & calibration state [skip ci]"
          
          # Force push to overwrite previous data commit (guarantees exactly 1 commit forever)
          git push --force origin data
