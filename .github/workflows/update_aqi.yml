name: Hourly AQI Batch Ingestion & Forecast Pipeline

on:
  schedule:
    # Run at the top of every hour (00:00, 01:00, 02:00, ...)
    - cron: '0 * * * *'
  workflow_dispatch:
    # Allow manual execution via GitHub UI

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Live Ingestion, XGBoost Forecasting & Gemini Advisories
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WAQI_API_TOKEN: ${{ secrets.WAQI_API_TOKEN }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          GEE_PROJECT_ID: ${{ secrets.GEE_PROJECT_ID }}
        run: |
          python -m backend.pipeline

      - name: Commit and Push Updated Grid Snapshots
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/delhi_current_grid.json backend/data/delhi_current_grid.json
          if git diff --staged --quiet; then
            echo "No telemetry changes to commit."
          else
            git commit -m "chore(telemetry): automated hourly AQI grid snapshot [skip ci]"
            git push
          fi
